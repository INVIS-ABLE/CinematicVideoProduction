name: Build standalone Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["studio-v*"]

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements_desktop.txt pytest
      - name: Install FFmpeg and Inno Setup
        shell: powershell
        run: |
          choco install ffmpeg innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and test
        run: python packaging/build.py
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CinematicStudioLocal-Windows-Installer
          path: dist/installer/*.exe
          if-no-files-found: error
